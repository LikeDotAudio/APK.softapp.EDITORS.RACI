<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RACI Matrix Operational Editor</title>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .main-layout {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 70px);
      padding: 16px;
      gap: 16px;
      box-sizing: border-box;
    }
    .panel {
      background: var(--surface-primary, #121A2F);
      border: 1px solid var(--border-color, #1E2A45);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }
    .panel-header {
      padding: 12px 16px;
      background: var(--surface-secondary, #0E1424);
      border-bottom: 1px solid var(--border-color, #1E2A45);
      font-weight: 600;
      font-size: 13px;
      color: var(--text-bright, #F0F4F8);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .table-container {
      flex: 1;
      overflow: auto;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    table.data-table th {
      background: var(--surface-secondary, #0E1424);
      color: var(--text-muted, #8B9BB4);
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color, #1E2A45);
      font-size: 11px;
      text-transform: uppercase;
    }
    table.data-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color, #1E2A45);
      color: var(--text-bright, #F0F4F8);
    }
    .inline-cell {
      background: rgba(255, 255, 255, 0.02);
      cursor: text;
    }
    .inline-cell:focus {
      outline: 1px solid var(--accent-orange, #F4902C);
      background: rgba(244, 144, 44, 0.1);
    }
    .raci-badge {
      display: inline-block;
      width: 32px;
      height: 32px;
      line-height: 30px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .badge-r {
      background: rgba(74, 158, 255, 0.2);
      color: #4A9EFF;
      border-color: #4A9EFF;
    }
    .badge-a {
      background: rgba(244, 144, 44, 0.25);
      color: #F4902C;
      border-color: #F4902C;
    }
    .badge-c {
      background: rgba(168, 85, 247, 0.2);
      color: #A855F7;
      border-color: #A855F7;
    }
    .badge-i {
      background: rgba(74, 222, 128, 0.2);
      color: #4ADE80;
      border-color: #4ADE80;
    }
    .badge-empty {
      background: rgba(255, 255, 255, 0.03);
      color: #4A5B73;
      border-color: #1E2A45;
    }
    .badge-empty:hover {
      border-color: #4A9EFF;
      color: #F0F4F8;
    }
    .btn-delete {
      background: transparent;
      border: none;
      color: #FF5A5A;
      cursor: pointer;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .btn-delete:hover {
      background: rgba(255, 90, 90, 0.2);
    }
    .legend-bar {
      display: flex;
      gap: 16px;
      padding: 8px 16px;
      background: var(--surface-bg, #080C16);
      border-bottom: 1px solid var(--border-color, #1E2A45);
      font-size: 11px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body class="deep-horizon">
  <div class="window-header">
    <div class="window-title">
      <span class="window-icon">👥</span>
      <span class="window-text">RACI Matrix Operational Editor</span>
      <span id="block-tag" class="block-tag">RACI BLOCK</span>
    </div>
    <div class="window-actions">
      <input type="text" id="prop-title" placeholder="Matrix Title" style="background: var(--surface-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 4px 8px; color: var(--text-bright); font-size: 12px; width: 220px;">
      <button id="btn-open" class="btn-action">📂 Open Block</button>
      <button id="btn-discovered" class="btn-action">⚡ Discovered</button>
      <button id="btn-save" class="btn-action btn-primary">💾 Save & Return</button>
      <button id="btn-close" class="btn-action btn-close">✕</button>
    </div>
  </div>

  <div class="main-layout">
    <div class="panel">
      <div class="panel-header">
        <span>Organizational Responsibility Assignment Matrix</span>
        <div style="display: flex; gap: 8px; align-items: center;">
          <span id="telemetry-badge" style="font-size: 12px; font-weight: bold; margin-right: 12px;">Auditing RACI...</span>
          <input type="text" id="input-new-role" placeholder="Add Role (e.g. Acoustic Consultant)" style="background: var(--surface-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 4px 8px; color: var(--text-bright); font-size: 12px; width: 180px;">
          <button id="btn-add-role" class="btn-action btn-small">+ Add Role</button>
          <button id="btn-add-task" class="btn-action btn-small">+ Add Deliverable</button>
        </div>
      </div>

      <div class="legend-bar">
        <div class="legend-item"><span class="raci-badge badge-r" style="width: 20px; height: 20px; line-height: 18px; font-size: 10px;">R</span> <strong>Responsible</strong> (Does the work)</div>
        <div class="legend-item"><span class="raci-badge badge-a" style="width: 20px; height: 20px; line-height: 18px; font-size: 10px;">A</span> <strong>Accountable</strong> (Final decision & sign-off)</div>
        <div class="legend-item"><span class="raci-badge badge-c" style="width: 20px; height: 20px; line-height: 18px; font-size: 10px;">C</span> <strong>Consulted</strong> (Two-way input)</div>
        <div class="legend-item"><span class="raci-badge badge-i" style="width: 20px; height: 20px; line-height: 18px; font-size: 10px;">I</span> <strong>Informed</strong> (Kept updated)</div>
      </div>

      <div class="table-container">
        <table class="data-table">
          <thead id="raci-table-header"></thead>
          <tbody id="raci-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="js/raciApp.js"></script>
</body>
</html>
